<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f7f6f0">
<title>Leonid Provoziuk — Selected Work — Interactive Portfolio</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;500;600&display=swap");
:root{--bg:#f7f6f0;--ink:#24241f;--muted:#75766f;--hair:#b7b5a9;--serif:"Instrument Serif",Georgia,serif;--sans:Inter,Arial,sans-serif}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink)}body{font-family:var(--sans);-webkit-font-smoothing:antialiased}
button,a{font:inherit}button{cursor:pointer;background:none;border:0;color:inherit}a{color:inherit}
header{padding:26px clamp(15px,4vw,62px) 18px;border-bottom:1px solid var(--hair);display:flex;justify-content:space-between;gap:14px;align-items:center}
header .brand{text-decoration:none;font-size:clamp(14px,1.65vw,22px);font-weight:500;letter-spacing:-.025em}
header .eyebrow{color:var(--muted);font-size:11px;letter-spacing:.09em;text-transform:uppercase}
main{max-width:1500px;padding:0 clamp(15px,4vw,62px) 80px;margin:auto}
.intro{padding:45px 0 43px;border-bottom:1px solid var(--hair)}
.tag{font-size:11px;color:var(--muted);letter-spacing:.09em;text-transform:uppercase}
h1,h2{font-family:var(--serif);font-weight:400;margin:17px 0 8px;line-height:.97;letter-spacing:-.03em}
h1{font-size:clamp(59px,10vw,148px)}h2{font-size:clamp(54px,8.5vw,112px)}
.intro p{max-width:560px;font-size:clamp(14px,1.5vw,17px);line-height:1.6;color:#51524b;margin:24px 0 0}
.projects{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(24px,3.8vw,57px) clamp(14px,2vw,35px);margin-top:38px}
.tile{text-align:left;padding:0;display:block;width:100%}.tile .square{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:#e7e6df}
.tile .meta{display:flex;justify-content:space-between;gap:10px;padding-top:13px;font-size:12px}.tile .meta span:last-child{color:var(--muted)}
.tile:hover .square{filter:contrast(1.06)}.tile:focus-visible,.ctrl:focus-visible{outline:2px solid #555;outline-offset:4px}
#detail[hidden],#home[hidden]{display:none}#detail .topline{padding:24px 0 22px;display:flex;justify-content:space-between;align-items:center;gap:15px;border-bottom:1px solid var(--hair)}
#detail .subtitle{max-width:600px;font-size:clamp(15px,2.3vw,25px);line-height:1.35;margin:24px 0 32px;font-family:var(--serif)}
.ctrl{border-bottom:1px solid currentColor;padding:6px 0;font-size:12px;text-transform:uppercase;letter-spacing:.07em}.close-project{display:inline-flex;align-items:center;justify-content:center;gap:15px;min-width:112px;min-height:48px;padding:8px 12px;border:1px solid transparent;touch-action:manipulation}.close-project:hover{border-color:var(--hair)}.close-icon{font-size:24px;line-height:1}.close-project:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.viewer{min-height:55vh;display:flex;align-items:center;justify-content:center;position:relative;background:#eeeae1;padding:16px}
.viewer img{max-width:100%;max-height:78vh;object-fit:contain;display:block}
.viewer.video{background:#191919}.viewer video{display:block;width:auto;max-width:100%;max-height:78vh;background:#121212}
.controls{display:flex;justify-content:space-between;gap:12px;align-items:center;border-bottom:1px solid var(--hair);padding:18px 0 21px}
.controls button{min-height:44px;min-width:70px;text-transform:uppercase;font-size:12px;letter-spacing:.07em}.controls button:disabled{opacity:.25;cursor:not-allowed}
#counter{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}.thumbnails{display:flex;gap:9px;overflow:auto;padding:18px 0 20px}
.thumbnails button{flex:0 0 auto;border:2px solid transparent;padding:0}.thumbnails button.active{border-color:#333}
.thumbnails img{height:80px;width:auto;max-width:140px;object-fit:cover;display:block}
.note{font-size:11px;color:var(--muted);line-height:1.55;padding-top:10px}
footer{margin-top:60px;padding:22px clamp(15px,4vw,62px);border-top:1px solid var(--hair);font-size:11px;color:var(--muted)}
@media(max-width:860px){.projects{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:550px){.projects{grid-template-columns:1fr}.intro{padding:45px 0 35px}.viewer{padding:9px;min-height:50vh}.viewer img{max-height:68vh}.viewer video{max-height:68vh}header .eyebrow{font-size:9px}.tile .meta{font-size:12px}}
.preview{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:18px 0}.preview-item{padding:0;min-width:0;aspect-ratio:16/10;background:#e9e7df;overflow:hidden}.preview-item img{display:block;width:100%;height:100%;object-fit:contain}.explore{display:block;width:100%;text-align:left;padding:22px 0;margin:12px 0 28px;border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);font-size:13px;letter-spacing:.06em}.explore:hover{text-decoration:underline}.preview[hidden],.explore[hidden]{display:none}@media(max-width:550px){.preview{gap:6px}.preview-item{aspect-ratio:3/4}.explore{padding:18px 0}} .preview.single{grid-template-columns:minmax(0,1fr);max-width:650px}.preview.single .preview-item{aspect-ratio:3/4}.preview.single img{object-fit:contain}.viewer img{width:auto;height:auto;max-width:100%;max-height:78vh} @media(max-width:550px){#detail .topline{padding:10px 0 12px}#detail h2{font-size:clamp(45px,13vw,64px);margin:16px 0 6px}#detail .subtitle{margin:12px 0 18px;font-size:21px;line-height:1.2}.preview{margin:10px 0}.explore{margin:10px 0 15px}.viewer{min-height:0;padding:10px}.viewer img{max-height:64vh}.controls{padding:8px 0}.thumbnails{padding:10px 0 14px}.close-project{min-height:48px;min-width:112px}} </style></head><body>
<header><a href="#home" class="brand">LEONID PROVOZIUK</a><div class="eyebrow">Independent designer · Selected work</div></header>
<main>
<section id="home"><div class="intro"><div class="tag">Selected projects · 07</div><h1>Selected work</h1><p>Editorial design, digital experiences and moving images — selected projects presented with care.</p></div><div class="projects" id="grid"></div></section>
<section id="detail" hidden><div class="topline"><span id="category" class="tag"></span><button class="ctrl close-project" id="back" type="button" aria-label="Close project and return to selected work"><span>CLOSE</span><span class="close-icon" aria-hidden="true">×</span></button></div><h2 id="heading"></h2><p class="subtitle" id="description"></p><div id="preview" class="preview"></div><button id="explore" class="explore">EXPLORE COMPLETE PRESENTATION ↗</button><div class="viewer" id="viewer"></div><div class="controls" id="controls"><button class="ctrl" id="previous" aria-label="Previous slide">← Previous</button><span id="counter" aria-live="polite"></span><button class="ctrl" id="next" aria-label="Next slide">Next →</button></div><div class="thumbnails" id="thumbnails"></div><div class="note" id="note"></div></section>
</main><footer>LEONID PROVOZIUK · Selected work</footer>

assets/Figma_Ready_HiRes/Wedding_Full_Gallery_27/slide_27.png"]}, {"slug": "lintu", "title": "Lintu", "category": "Web / Digital", "cover": "assets/Figma_Ready_HiRes/COVER_SQUARE_02_Lintu.png", "intro": "A digital experience for intelligent drone delivery, presented through focused landscape case-study boards.", "slides": ["assets/Figma_Ready_HiRes/Lintu_Landscape_Slides_6/slide_01_RETOUCHED.png", "assets/Figma_Ready_HiRes/Lintu_Landscape_Slides_6/slide_02.png", "assets/Figma_Ready_HiRes/Lintu_Landscape_Slides_6/slide_03.png", "assets/Figma_Ready_HiRes/Lintu_Landscape_Slides_6/slide_04.png", "assets/Figma_Ready_HiRes/Lintu_Landscape_Slides_6/slide_05.png", "assets/Figma_Ready_HiRes/Lintu_Landscape_Slides_6/slide_06.png"]}, {"slug": "skvot", "title": "Skvot", "category": "Campaign / Digital", "cover": "assets/Figma_Ready_HiRes/COVER_SQUARE_03_Skvot.png", "intro": "A complete campaign presented in six readable sections, preserving the original artwork and proportions.", "slides": ["assets/Skvot_Gallery_6/panel_01.jpg", "assets/Skvot_Gallery_6/panel_02.jpg", "assets/Skvot_Gallery_6/panel_03.jpg", "assets/Skvot_Gallery_6/panel_04.jpg", "assets/Skvot_Gallery_6/panel_05.jpg", "assets/Skvot_Gallery_6/panel_06.jpg"]}, {"slug": "rings", "title": "Jewelry Rings", "category": "Motion / Film", "cover": "assets/Figma_Ready_HiRes/COVER_SQUARE_04_Jewelry_Rings.png", "intro": "Original jewelry motion project.", "video": "assets/jewelry.mp4", "poster": "assets/Figma_Ready_HiRes/Jewelry_Rings_poster_original.png"}, {"slug": "aura", "title": "Aura", "category": "Motion / Film", "cover": "assets/Figma_Ready_HiRes/COVER_SQUARE_05_Aura.png", "intro": "Original motion film. Video is the primary work; the poster serves only as a cover.", "video": "assets/aura.mp4", "poster": "assets/Figma_Ready_HiRes/Aura_poster_original.png"}, {"slug": "volterra", "title": "Volterra", "category": "Web / UI", "cover": "assets/Figma_Ready_HiRes/COVER_SQUARE_06_Volterra.png", "intro": "An industrial digital let current=null,slide=0,homeScrollY=0;const $=x=>document.getElementById(x);
function showHome(){if(!current)return;current=null;history.replaceState({view:'home'},'','#home');$('home').hidden=false;$('detail').hidden=true;requestAnimationFrame(()=>{window.scrollTo({top:homeScrollY,behavior:'instant'});document.querySelector('#grid').setAttribute('tabindex','-1');document.querySelector('#grid').focus({preventScroll:true})})}
function openProject(id){let p=DATA.find(x=>x.slug===id);if(!p)return;if(!current)homeScrollY=window.scrollY;current=p;slide=0;history.replaceState({view:id},'','#'+id);$('home').hidden=true;$('detail').hidden=false;$('heading').textContent=p.title;$('category').textContent=p.category;$('description').textContent=p.intro;render();window.scrollTo(0,0)}
function render(){let p=current;if(!p)return;const v=$('viewer');v.replaceChildren();const pr=$('preview');pr.replaceChildren();$('explore').hidden=!!p.video;v.className='viewer'+(p.video?' video':'');$('thumbnails').replaceChildren();$('controls').hidden=!!p.video;
 if(p.video){pr.hidden=true;let vid=document.createElement('video');vid.src=p.video;vid.controls=true;vid.playsInline=true;vid.preload='metadata';vid.poster=p.poster||p.cover;vid.setAttribute('aria-label',p.title+' original video');v.append(vid);$('counter').textContent='ORIGINAL VIDEO';$('note').textContent='The original source video plays directly. If this browser blocks local video files, open this proof via a local web server.';return}
 pr.hidden=false;const sample=[0,Math.floor((p.slides.length-1)/2),p.slides.length-1];[...new Set(sample)].forEach(i=>{let b=document.createElement('button');b.className='preview-item';b.setAttribute('aria-label','Open '+p.title+' slide '+(i+1));let im=document.createElement('img');im.src=p.slides[i];im.alt='Preview '+(i+1);b.append(im);b.onclick=()=>{slide=i;render();$('viewer').scrollIntoView({behavior:'smooth',block:'center'})};pr.append(b)});pr.classList.toggle('single',p.slides.length===1);$('explore').textContent='EXPLORE ALL '+p.slides.length+' SLIDES →';let im=document.createElement('img');im.src=p.slides[slide];im.alt=p.title+' — slide '+(slide+1)+' of '+p.slides.length;v.append(im);$('counter').textContent=String(slide+1).padStart(2,'0')+' / '+String(p.slides.length).padStart(2,'0');$('previous').disabled=slide===0;$('next').disabled=slide===p.slides.length-1;
 p.slides.forEach((s,i)=>{let b=document.createElement('button');b.className=i===slide?'active':'';b.setAttribute('aria-label','Go to slide '+(i+1));let thumb=document.createElement('img');thumb.src=s;thumb.loading='lazy';thumb.alt='';b.append(thumb);b.onclick=()=>{slide=i;render()};$('thumbnails').append(b)});$('note').textContent='Use Previous / Next, the thumbnails, or the ← / → keys. Images are displayed with contain sizing and are never enlarged from mobile screenshots.'}
$('grid').replaceChildren();DATA.forEach((p,i)=>{let b=document.createElement('button');b.className='tile';b.setAttribute('aria-label','Open '+p.title);let img=document.createElement('img');img.className='square';img.src=p.cover;img.loading='eager';img.alt=p.title+' project cover';let line=document.createElement('div');line.className='meta';let a=document.createElement('span');a.textContent=String(i+1).padStart(2,'0')+' / '+p.title;let c=document.createElement('span');c.textContent=p.category;line.append(a,c);b.append(img,line);b.onclick=()=>openProject(p.slug);$('grid').append(b)});
$('previous').onclick=()=>{if(current&&!current.video&&slide>0){slide--;render()}};
$('next').onclick=()=>{if(current&&!current.video&&slide<current.slides.length-1){slide++;render()}};
$('explore').onclick=()=>{$('viewer').scrollIntoView({behavior:'smooth',block:'center'});};$('back').onclick=showHome;document.querySelector('header .brand').onclick=e=>{e.preventDefault();showHome()};
document.addEventListener('keydown',e=>{if(!current)return;if(e.key==='Escape'){e.preventDefault();showHome();return}if(current.video)return;if(e.key==='ArrowRight'&&slide<current.slides.length-1){slide++;render()}if(e.key==='ArrowLeft'&&slide>0){slide--;render()}});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(DATA.some(p=>p.slug===h))openProject(h);else if(current)showHome()});let start=location.hash.slice(1);if(DATA.some(p=>p.slug===start))openProject(start);else {$('home').hidden=false;$('detail').hidden=true;}
</script></body></html>

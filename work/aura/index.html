/* Shared family editorial visual language: serif mastheads, asymmetric portfolio, breathing room */
@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;500;600&display=swap');
:root{--bg:#f6f5ee;--ink:#22211d}
body{font-family:Inter,Arial,sans-serif}
header{min-height:82px;padding-left:clamp(22px,3vw,46px);padding-right:clamp(22px,3vw,46px)}
header .brand{font-weight:500;letter-spacing:-.025em}
nav a{font-size:11px;text-underline-offset:5px}
nav a:hover{text-decoration:underline}
main{padding-top:clamp(55px,6vw,95px)}
h1{font-family:'Instrument Serif',Georgia,serif;letter-spacing:-.035em;font-weight:400;line-height:1.02}
.lead{font-family:'Instrument Serif',Georgia,serif;font-size:clamp(27px,3.1vw,48px);line-height:1.12;max-width:970px}
.eyebrow,.meta{letter-spacing:.1em;color:#76746d}
.project-list{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:clamp(40px,6vw,100px) clamp(14px,2.2vw,32px)}
.project-list>a,.project-list>article,.project-list>div{grid-column:span 6;min-width:0}
.project-list>:nth-child(4n+2){grid-column:span 5;margin-top:clamp(50px,8vw,125px)}
.project-list>:nth-child(4n+3){grid-column:span 5;margin-top:clamp(20px,4vw,60px)}
.project-list>:nth-child(4n+4){grid-column:span 6;margin-top:clamp(50px,8vw,110px)}
.project-list>:nth-child(7){grid-column:span 8}
.project-list img{aspect-ratio:4/5;object-fit:cover;display:block;background:#e9e7e0;transition:transform .4s ease}
.project-list>:nth-child(3n+2) img{aspect-ratio:5/4}
.project-list>:nth-child(3n+3) img{aspect-ratio:1/1}
.project-list a:hover img{transform:scale(1.012)}
.project-list h2{font-family:'Instrument Serif',Georgia,serif;font-size:clamp(24px,2.7vw,41px);margin-top:8px}
.filters{gap:6px;margin-bottom:60px;border-top:1px solid #b9b7af;padding-top:20px}
.filters button{border:0;border-bottom:1px solid transparent;padding:9px 11px;font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.filters button[aria-pressed=true]{background:transparent;color:var(--ink);border-bottom-color:var(--ink)}
.gallery{gap:clamp(55px,9vw,150px)}
.gallery figure{max-width:1400px;margin:0 auto}
.gallery figure:nth-child(3n+2){max-width:82%;margin-left:0}
.gallery figure:nth-child(3n+3){max-width:82%;margin-right:0}
.gallery img,.gallery video{max-height:90vh}
.gallery figcaption{padding-top:12px;border-top:1px solid #d4d2c9;margin-top:16px;letter-spacing:.04em}
.next{margin-top:clamp(100px,13vw,200px)}
@media(max-width:860px){
 .project-list{grid-template-columns:repeat(2,minmax(0,1fr));gap:52px 20px}
 .project-list>a,.project-list>article,.project-list>div,.project-list>:nth-child(n){grid-column:auto;margin-top:0}
 .project-list>:nth-child(even){margin-top:65px}
 .project-list>:nth-child(7){grid-column:1/-1;max-width:80%}
}
@media(max-width:650px){
 header{min-height:72px}
 main{padding-top:55px}
 h1{font-size:clamp(60px,15vw,96px)}
 .lead{font-size:clamp(26px,8vw,40px)}
 .project-list{grid-template-columns:1fr;gap:56px}
 .project-list>a,.project-list>article,.project-list>div,.project-list>:nth-child(n){grid-column:1;margin:0;max-width:100%}
 .project-list>:nth-child(even){margin-left:7vw}
 .project-list>:nth-child(odd){margin-right:6vw}
 .project-list>:nth-child(7){max-width:100%}
 .project-list img{aspect-ratio:4/5}
 .project-list>:nth-child(3n+2) img{aspect-ratio:5/4}
 .project-list h2{font-size:32px}
 .gallery figure:nth-child(n){max-width:100%;margin-left:auto;margin-right:auto}
 .gallery{gap:65px}
 .filters{gap:3px;margin-bottom:35px}
 .filters button{padding:9px 8px}
}
@media(prefers-reduced-motion:reduce){.project-list img{transition:none}}
